   upstream fastapi_backend {
       server 127.0.0.1:8002;
   }

   # HTTP → HTTPS redirect
   server {
       listen 80;
       server_name sitapi.salespoint.stc.com.kw;
       return 301 https://$host$request_uri;
   }

   # HTTPS server
   server {
       listen 443 ssl;
       server_name sitapi.salespoint.stc.com.kw;

       ssl_certificate /etc/nginx/ssl/fullchain.crt;
       ssl_certificate_key /etc/nginx/ssl/server.key;

       # FastAPI often handles large file uploads, keep this aligned with your needs
       client_max_body_size 200M;

       # Increased timeouts for long-running API processes
       proxy_read_timeout 720s;
       proxy_connect_timeout 720s;
       proxy_send_timeout 720s;

       access_log /var/log/nginx/fastapi.access.log;
       error_log /var/log/nginx/fastapi.error.log;

       location / {
           proxy_pass http://fastapi_backend;

           # Standard proxy headers (Crucial for FastAPI + Uvicorn)
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header X-Forwarded-Host $host;

           # Support for WebSockets (Standard in FastAPI)
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection "upgrade";

           proxy_redirect off;
       }

       # Gzip compression for faster API responses
       gzip on;
       gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
